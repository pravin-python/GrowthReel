server_tokens off;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route (e.g. /dashboard/leads) serves index.html
    # so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api to the FastAPI service. ${API_UPSTREAM} is the
    # origin only (scheme://host[:port], no trailing slash) — e.g.
    # "http://api:8001" for docker-compose (its default below), or
    # "https://api-xxxx-xxxx.a.run.app" for Cloud Run, where "api" is a
    # separate service with its own HTTPS URL rather than a reachable
    # hostname on a shared docker network. This file is an nginx *template*:
    # ${PORT}/${API_UPSTREAM} are substituted by the base image's own
    # docker-entrypoint envsubst step at container start (see Dockerfile),
    # not at build time, so one image works unmodified in both places.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
