server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route (e.g. /dashboard/leads) serves index.html
    # so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api to the FastAPI service (compose service name "api",
    # listening on 8001 — see api/Dockerfile's EXPOSE and
    # api/app/core/uvicorn_worker.py).
    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
