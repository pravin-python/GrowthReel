# Root-level "edge" reverse proxy for local docker-compose use. It is the
# only container that publishes a port to the host; it routes by Host header
# to the two domains described in the project README:
#
#   growthreel.localhost      -> backend  (Django: marketing site, blog, admin/CRM)
#   app.growthreel.localhost  -> frontend (React SPA; its own nginx proxies
#                                          /api/ to the FastAPI `api` service)
#
# `*.localhost` resolves to 127.0.0.1 without editing /etc/hosts on most
# modern OSes/browsers (RFC 6761). If yours doesn't, add both names to your
# hosts file pointing at 127.0.0.1.
#
# This is a local development convenience, NOT a production TLS setup — it
# terminates nothing and serves plain HTTP. A real deployment replaces this
# with a proper TLS-terminating load balancer/ingress in front of the same
# two upstream services, setting `X-Forwarded-Proto: https` for real.

# VAPT #14 (server banner): don't advertise the nginx version in the
# `Server` response header or on any auto-generated error page.
server_tokens off;

server {
    listen 80;
    server_name growthreel.localhost localhost;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.growthreel.localhost;

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
