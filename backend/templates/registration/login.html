{% extends "layout/base.html" %}

{% block title %}Log in — GrowthReel{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Log in</h1>

    {% if form.errors %}
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
            Your email and password didn't match. Please try again.
        </div>
    {% endif %}

    <form method="post" class="space-y-5 bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
        {% csrf_token %}

        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-700">
                Email
            </label>
            <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                   autocomplete="email" required autofocus
                   class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                          focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-700">
                Password
            </label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                   autocomplete="current-password" required
                   class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                          focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit"
                class="w-full inline-flex justify-center rounded-md bg-indigo-600 px-4 py-2.5 text-sm
                       font-semibold text-white shadow-sm hover:bg-indigo-500">
            Log in
        </button>
    </form>
</div>
{% endblock %}
