<header class="bg-white border-b border-slate-200">
    <nav class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
        <a href="{% url 'home' %}" class="text-lg font-semibold tracking-tight text-indigo-600">
            GrowthReel
        </a>
        <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
            <a href="{% url 'blog:list' %}" class="hover:text-indigo-600">Blog</a>
            {% if request.user.is_authenticated %}
                <span class="text-slate-400">{{ request.user.email }}</span>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="hover:text-indigo-600">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'users:login' %}" class="hover:text-indigo-600">Log in</a>
            {% endif %}
        </div>
    </nav>
</header>
