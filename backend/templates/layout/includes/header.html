<header class="sticky top-0 z-50 border-b border-white/10 bg-[#0a1830]/90 backdrop-blur-lg">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="{% url 'home' %}" class="flex shrink-0 items-center gap-2 text-base font-semibold tracking-tight text-white sm:text-lg">
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-brand-blue to-brand-mint text-sm font-bold shadow-[0_0_16px_rgba(15,252,190,0.5)]">G</span>
            <span>GrowthReel</span>
        </a>
        <div class="flex items-center gap-3 text-sm font-medium text-white/70 sm:gap-6">
            <a href="{% url 'about' %}" class="hidden sm:inline hover:text-white">About</a>
            <a href="{% url 'blog:list' %}" class="hidden sm:inline hover:text-white">Blog</a>
            {% if request.user.is_authenticated %}
                <span class="hidden text-white/40 sm:inline">{{ request.user.email }}</span>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="whitespace-nowrap hover:text-white">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'users:login' %}" class="hidden whitespace-nowrap hover:text-white sm:inline">Log in</a>
                <a href="{% url 'users:login' %}"
                   class="shine-btn whitespace-nowrap rounded-full bg-gradient-to-r from-brand-blue to-brand-mint px-4 py-2 text-xs font-semibold text-white shadow-[0_8px_20px_-8px_rgba(15,252,190,0.6)] transition-transform hover:scale-105">
                    Start Free Trial
                </a>
            {% endif %}
        </div>
    </nav>
</header>
