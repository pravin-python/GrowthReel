{% if messages %}
    <div class="mx-auto max-w-5xl w-full px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
        {% for message in messages %}
            <div class="rounded-md bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-800">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
