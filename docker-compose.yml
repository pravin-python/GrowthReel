# Local development / integration-testing compose stack for all three
# GrowthReel services plus their shared Postgres/Redis infrastructure.
#
# This is NOT a production manifest (no TLS, single replica, no secrets
# manager) — see each service's own README for production deployment notes.
# It exists to let you run the whole system together locally and exercise
# the real cross-service contracts (Django ORM shared by `backend` and
# `api`, the bridge-JWT SSO handoff, the React app's reverse-proxied API
# calls) against real Postgres/Redis containers instead of each service's
# own standalone local-dev shortcuts (SQLite, LocMemCache, Vite mocks).
#
# Before running `docker compose up --build`:
#   1. cp backend/.env.example backend/.env
#   2. cp api/.env.example api/.env
#   3. Set the SAME value for SHARED_JWT_SECRET in both files (required —
#      see backend/README.md "Contract for the FastAPI service").
#   4. (Optional) cp frontend-app/.env.example frontend-app/.env — note
#      VITE_* vars are baked in at image BUILD time, not read at container
#      start, so changing it requires `docker compose build frontend` again.
#   5. Add `127.0.0.1 growthreel.localhost app.growthreel.localhost` to your
#      hosts file if your OS/browser doesn't already resolve *.localhost to
#      127.0.0.1 automatically.
#
# `DB_*`, `REDIS_URL`, `BACKEND_DIR`, `DJANGO_SETTINGS_MODULE`,
# `DJANGO_FORCE_HTTPS` and `ENV` below are deliberately set directly in this
# file (overriding whatever's in each service's own .env) so the compose
# network wiring is always correct regardless of each .env's own local-dev
# defaults. There is no DATABASE_URL anywhere in this project — both
# config.settings.local and .production read the same discrete DB_ENGINE/
# DB_NAME/DB_USER/DB_PASSWORD/DB_HOST/DB_PORT/DB_SSLMODE variables (see
# backend/.env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growthreel
      POSTGRES_USER: growthreel
      POSTGRES_PASSWORD: growthreel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthreel -d growthreel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Local docker-compose has no TLS-terminating proxy in front of it —
      # see the DJANGO_FORCE_HTTPS doc comment in config/settings/production.py.
      DJANGO_FORCE_HTTPS: "false"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: growthreel
      DB_USER: growthreel
      DB_PASSWORD: growthreel
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable # compose's postgres container has no TLS listener
      REDIS_URL: redis://redis:6379/0
      APP_FRONTEND_URL: http://app.growthreel.localhost
      CORS_ALLOWED_ORIGINS: http://app.growthreel.localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_FORCE_HTTPS: "false"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: growthreel
      DB_USER: growthreel
      DB_PASSWORD: growthreel
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info
    restart: unless-stopped

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    environment:
      BACKEND_DIR: /backend
      DJANGO_SETTINGS_MODULE: config.settings.production
      # These DB_* vars aren't read by this service's own code — they exist
      # purely so that when django.setup() reads /backend/.env (the
      # bind-mounted host file, whose own DB_HOST is "localhost" for native
      # dev), these already-set process env vars win instead (django-environ
      # only fills in values that aren't already set) and correctly point at
      # the "postgres" compose service rather than "localhost".
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: growthreel
      DB_USER: growthreel
      DB_PASSWORD: growthreel
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      APP_FRONTEND_URL: http://app.growthreel.localhost
      CORS_ORIGINS: http://app.growthreel.localhost
      # "local" here only skips the Redis bridge-jti replay check and the
      # Secure-cookie flag (see api/app/core/config.py `is_production`) —
      # it does NOT affect which database the shared Django ORM talks to,
      # which is always the real `postgres` container above. See this
      # compose file's top-of-file note.
      ENV: local
    volumes:
      - ./backend:/backend:ro
    depends_on:
      - backend
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-app
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
