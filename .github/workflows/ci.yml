name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three independent, parallel pipelines (one per service) rather than one
# combined job — a frontend-only change shouldn't wait on Python jobs, and
# vice versa. `backend` and `api` are intentionally NOT wired together here
# (no shared Postgres/Redis service containers): both run their own test
# suite against SQLite (see backend/config/settings/testing.py and
# api/tests/conftest.py), exactly like local development, so neither needs
# the other service's database to be up in CI.

jobs:
  backend-lint:
    name: backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements/testing.txt ruff black mypy django-stubs bandit[toml]
      - run: ruff check backend --config backend/pyproject.toml
      - run: black --check backend --config backend/pyproject.toml
      - run: mypy backend --config-file backend/pyproject.toml
        continue-on-error: true # strict mode; see backend/pyproject.toml note on django-stubs coverage

  backend-test:
    name: backend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: ci-test-secret-key
      SHARED_JWT_SECRET: ci-test-shared-jwt-secret-at-least-32-bytes-long
      APP_FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/testing.txt
      - run: pip install -r requirements/testing.txt
      - run: pytest --cov=apps --cov-report=term-missing

  backend-security-audit:
    name: backend / security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements/production.txt "bandit[toml]" pip-audit
      - run: bandit -c backend/pyproject.toml -r backend/apps backend/config
      - run: pip-audit -r backend/requirements/production.txt
        continue-on-error: true # advisory: a new CVE in a pinned dep shouldn't block merges by itself

  api-lint:
    name: api / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements/testing.txt ruff black mypy bandit[toml]
      - run: ruff check api --config api/pyproject.toml
      - run: black --check api --config api/pyproject.toml
      - run: mypy api --config-file api/pyproject.toml
        continue-on-error: true

  api-test:
    name: api / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SHARED_JWT_SECRET: ci-test-shared-jwt-secret-at-least-32-bytes-long
      APP_FRONTEND_URL: http://localhost:5173
      ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements/testing.txt
      - run: pip install -r requirements/testing.txt
      - run: pytest

  api-security-audit:
    name: api / security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements/production.txt "bandit[toml]" pip-audit
      - run: bandit -c api/pyproject.toml -r api/app
      - run: pip-audit -r api/requirements/production.txt
        continue-on-error: true

  frontend:
    name: frontend / lint, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
        continue-on-error: true # advisory, same rationale as pip-audit above
